services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongo_data:
