name: Docker Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f Dockerfile.server -t quizmaster-server .

      - name: Build client image
        run: docker build -f Dockerfile.client -t quizmaster-client .
